[package]
name = "yookassa"
version = "0.1.1"
edition = "2024"
description = "Async YooKassa API client: payments, refunds, receipts, deals, payouts, invoices, webhooks and notifications"
license = "MIT"
repository = "https://github.com/amnesiaof/yookassa"
keywords = ["yookassa", "payments", "api", "webhook", "receipt"]
categories = ["api-bindings"]

[dependencies]
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
